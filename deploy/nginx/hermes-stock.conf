upstream hermes_stock_api {
    least_conn;
    include /etc/nginx/hermes-stock-upstream-servers.conf;
    keepalive 32;
}

log_format hermes_timing '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         'rt=$request_time uct=$upstream_connect_time '
                         'uht=$upstream_header_time urt=$upstream_response_time '
                         '"$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;

    root /opt/hermes-stock/current/frontend/dist;
    index index.html;
    access_log /var/log/nginx/hermes-stock-access.log hermes_timing;

    location = /rabbit {
        return 301 /rabbit/;
    }

    location /rabbit/api/ {
        proxy_pass http://127.0.0.1:18081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /rabbit/ {
        alias /opt/hermes-rabbit/current/frontend/dist/;
        try_files $uri $uri/ /rabbit/index.html;
    }

    # 飞书长连接是进程内状态，只能由唯一的后台实例读取和控制。
    location ^~ /api/feishu-bots {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        proxy_pass http://hermes_stock_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

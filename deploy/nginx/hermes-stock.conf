upstream hermes_stock_api {
    least_conn;
    include /etc/nginx/hermes-stock-upstream-servers.conf;
    keepalive 32;
}

log_format hermes_timing '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         'rt=$request_time uct=$upstream_connect_time '
                         'uht=$upstream_header_time urt=$upstream_response_time '
                         '"$http_referer" "$http_user_agent"';

map "$scheme:$host:$uri" $hermes_force_https {
    default 0;
    ~^http:(shijingxuan\.com|www\.shijingxuan\.com):/\.well-known/acme-challenge/ 0;
    ~^http:(shijingxuan\.com|www\.shijingxuan\.com): 1;
}

server {
    listen 80 default_server;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shijingxuan.com www.shijingxuan.com _;

    if ($hermes_force_https) {
        return 308 https://shijingxuan.com$request_uri;
    }

    # HTTP-01 must be reachable before the HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hermes-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    ssl_certificate /etc/letsencrypt/live/shijingxuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shijingxuan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hermes_stock_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/hermes-stock/current/frontend/dist;
    index index.html;
    access_log /var/log/nginx/hermes-stock-access.log hermes_timing;

    # The application accepts documents up to 20 MB. Leave room for
    # multipart framing while keeping the application-level limits authoritative.
    client_max_body_size 32m;

    location = /rabbit {
        return 301 /rabbit/;
    }

    location /rabbit/api/ {
        proxy_pass http://127.0.0.1:18081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /rabbit/ {
        alias /opt/hermes-rabbit/current/frontend/dist/;
        try_files $uri $uri/ /rabbit/index.html;
    }

    # 飞书长连接是进程内状态，只能由唯一的后台实例读取和控制。
    location ^~ /api/feishu-bots {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        proxy_pass http://hermes_stock_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

[project]
name = "hermes-stock"
version = "0.1.0"
description = "Local A-share multi-agent research and risk-control workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy>=2.0.36",
    "PyMySQL>=1.1.1",
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    "paramiko>=3.4.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "lark-oapi>=1.7.0",
    "pypdf>=5.6.0,<6",
    "pdfplumber>=0.11.7,<0.12",
    "python-docx>=1.1.2,<2",
    "python-pptx>=1.0.2,<2",
    "openpyxl>=3.1.5,<4",
    "chromadb>=0.5.0",
    "pymilvus==2.6.16",
    "sentence-transformers>=3.0.0",
    "agentscope[storage]==2.0.4.post1",
    "mcp>=1.28.1,<2",
    "redis>=5.2.0,<7",
    "PyYAML>=6.0.2,<7",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "sqlglot>=30.20,<31",
    "markdown-it-py>=3.0,<5",
    "nh3>=0.3,<0.4",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp==1.42.1",
    "tushare>=1.4.29,<2",
]

# 可选：position_import v2 试点（STOCK_POSITION_AGENT_V2=true 时才用）。
# 默认不装，env 关时 position_import 走旧 httpx 路径，零影响。装：pip install -e ".[ai]"
# 可选：akshare 降级新闻搜索源（Tavily/Brave 不可用时启用；生产 requirements.txt 已含）。装：pip install -e ".[news]"
[project.optional-dependencies]
ai = ["pydantic-ai>=2.0"]
news = ["akshare>=1.18.0"]

[project.scripts]
hermes-api = "backend.app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Vibe-Trading keeps formula modules self-contained with a shared import prelude.
"backend/app/quant/factors/zoo/**/*.py" = ["E741", "F401", "F841"]
# These names are provided lazily through module-level __getattr__.
"backend/app/quant/factors/_backend.py" = ["F822"]

[tool.setuptools.packages.find]
include = ["backend*"]
